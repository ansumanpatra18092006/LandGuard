services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: landguard
      POSTGRES_USER: landguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - landguard_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landguard -d landguard"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  landguard_data:
